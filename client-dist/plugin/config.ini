; ============================================================
;  CMSLauncherLite / Hook.dll  运行时配置
; ============================================================
;
;  放在客户端主目录（和 MapleStory.exe / Launcher.exe 同一个文件夹）。
;  这个文件可以不写：
;    - 没有这个文件   -> 全部用 Hook.dll 里内置的默认值（也就是下面注释里写的那些值）
;    - 文件里没写的项 -> 保持内置默认值
;    - 文件里写了的项 -> 覆盖内置默认值（存盘后重启客户端就生效，不用重新编译 DLL）
;
;  语法：
;    [小节名]      只是一个分组标题，程序不解析，写不写都行
;    键=值         键名不分大小写；等号两边多打的空格会被忽略
;    ; 或 #        整行注释；写在一行后面也是注释（所以值里不能出现 ; 和 #）
;    布尔值        true / false，也认 1 / 0、yes / no、on / off
;    整数          十进制，也认 0x 开头的十六进制
;    字符串        照原样取，不要加引号
;
;  注意：
;    1) 这个文件只能改下面列出的这些开关。别的（HUD 细项、补丁偏移表之类）还是编译期的
;       常量，要改必须重新编译 Hook.dll。
;    2) 文件存成 UTF-8 或 ANSI(GBK) 都能读：键名和值必须都是英文/数字，中文只出现在注释里。
;    3) 想确认到底读到没有：用 DebugView 之类的工具看 [Config] 开头的日志。
;
; ============================================================


[general]
; ------------------------------------------------------------
;  资源与连接
; ------------------------------------------------------------
; 服务器地址。
ServerAddr = 127.0.0.1

; 游戏窗口标题。
WindowTitle = dwang053
;   ^ 这项保留了你原来的值（新版默认：goms）

; 资源读取方式。
;   false = 读原版 WZ 档（Base.wz / String.wz / UI.wz ...），这是 GMS v053 本来的样子。
;           本客户端只需要那些分门的 .wz，不需要 Data.wz。
;   true  = 读 Data 文件夹里的 IMG。想手工改资源（导出 xml、改完再打包回 img）的时候用这个，
;           能躲开一部分 WZ 解析引起的崩溃。
; 想用 true，客户端目录里得真的有 Data 文件夹，否则会找不到资源。
UseImgMode = true

; 调试：把引擎打开的每一个资源文件都打一行日志（找缺失资源时开）。
; 平时关掉 —— 会明显拖慢加载。
DebugFileAccess = false


[resolution]
; ------------------------------------------------------------
;  分辨率与镜头
; ------------------------------------------------------------
; 分辨率档位，对应 DLL 内置的档位表：
;   0 = 800 x 600（原版）   1 = 1366 x 768   2 = 1600 x 900
; 写别的数字会被当成 0。档位越高越吃显存，也越容易在某些地图上出问题；实测 1 最稳。
; 登录界面永远是 800x600，进了地图才切到这一档 —— 这是客户端的限制，不是 bug。
ScreenResolutionIndex = 1

; 分辨率日志。DebugResolution 打关键几步；DebugResolutionVerbose 打全部细节（非常吵）。
DebugResolution = true
DebugResolutionVerbose = false

; true = 允许在游戏里用热键实时切换上面那个档位（调试用）。发布版建议 false。
RuntimeResolutionSwitch = true

; true = 客户端启动时就把分辨率补丁打好。必须 true，否则分辨率不会生效。
ApplyAtStartup = true

; true  = 创建和分辨率等大的后台缓冲区。画面最干净，但显存占用高，
;         老显卡 / 核显 / 远程桌面下可能黑屏。
; false = 让 D3D 按需拉伸，兼容性更好（个别场景边缘可能有一条拉伸痕迹）。
ExactScreenBuffers = false

; true = 镜头贴边：人物走到地图墙边时画面不再跟着走，也就不需要渲染地图外面的
;        （VR 之外）本来看不到的素材，不会再有地图下沿"穿出去"的穿帮。
;        就是 kaentake 那种"到墙边就不动了"的效果。
ClampCameraToMap = true

; ------------------------------------------------------------
;  镜头纵向"收多少"（河下面那截地面）
; ------------------------------------------------------------
; 百分比 0~100。基准是不 hook 分辨率的原版那条线（画面下沿 = 地图 VR 的 bottom；
; 没有 VR 节点的图就是 实体范围 MBR.bottom + 100）。地图实体范围通常比这条线高，
; 中间那一段就是"河下面多露出来的地面"，这里决定收掉多少：
;     收掉的量 = (画面下沿 - MBR.bottom) × 这个百分比
;   0   = 完全不收（原版行为：河完整，但底下多露一截）
;   100 = 一直收到 MBR.bottom（实测**收太狠**：河的下半截被切、240010000 人走到屏幕外）
;   50  = 收一半（默认，就是"比 100 少一半"）
; 没有多余余量的地图不受影响；改完重启客户端即可，不用重编。

; 默认50
CameraBottomSlack = 50


; ------------------------------------------------------------
;  单张地图的镜头特例（上面那条 CameraBottomSlack 是默认值）
; ------------------------------------------------------------
; 写法：CameraBottomSlack.地图ID = 0~100（想写几行都行；地图 ID = 进图时服务端下发的编号，
; 也就是小地图/聊天里那张图的号）。没列出的地图一律用上面的默认值；写 0 = 那张图恢复原版。
; 生效情况：DebugView 挂着，每换一张图会打一行（只在换图时打）：
;     [Resolution] camera slack: map 240010000 (field+0xDC) -> bottom 100% (from wildcard 91*) top 0% (defaults 50% / 0%)
;CameraBottomSlack.240010000 = 100
;CameraBottomSlack.100000000 = 0
;
; 还支持通配（前缀匹配，`*` 只能放末尾，位数随意）：编号以这几个数字开头的地图都用这个值。
; 优先级：**精确编号 > 更长的前缀 > 更短的前缀**（9100* 比 91* 具体，所以先命中 9100*），
; 都没命中才用上面的默认值。
;     CameraBottomSlack.91*    = 80       → 910000000 ~ 919999999 这一片（自由市场等）用 80
;     CameraBottomSlack.2404*  = 100      → 240400000 开头那几张用 100
;     CameraBottomSlack.9*     = 60       → 所有 9 开头的图都用 60
;CameraBottomSlack.91* = 80
CameraBottomSlack.000000001 = 0
CameraBottomSlack.000000002 = 0

;自由市场需要缩放
CameraBottomSlack.91* = 100
;射手区域
CameraBottomSlack.1000* = 100
CameraBottomSlack.104* = 100


; ------------------------------------------------------------
;  画面上沿也收一点（有些地图上半部分对不齐）
; ------------------------------------------------------------
; 和上面 CameraBottomSlack 完全对称，只是作用在画面上沿：有些地图视口比美术高，上沿会露出
; 补齐/错位的背景，把上沿收一点，那一截就不再显示了：
;     收掉的量 = (地图实体上沿 - 画面上沿) × 这个百分比
;   0   = 不收起（默认，行为和以前完全一样）
;   50  = 收一半；100 = 一直收到地图实体上沿（收太狠会把地图上部内容也挤掉，自己试）
; 同样支持按地图写和通配（规则同上：精确编号 > 更长前缀 > 更短前缀）：
;     CameraTopSlack.240010000 = 50
;     CameraTopSlack.24* = 30
; 上下沿各管各的，可以只用其中一个。改完重启客户端。
CameraTopSlack = 0
;CameraTopSlack.240010000 = 50
;CameraTopSlack.24* = 30

; ------------------------------------------------------------
;  画面上沿"硬裁剪"：最上面 N 像素直接不显示（站哪都有效）
; ------------------------------------------------------------
; CameraTopSlack 只是"镜头不许走到那么高"，只有镜头贴到范围上限时才有用；而背景层如果是自己
; 平铺/拉伸满屏的（例如龙之谷 240040700 的天空层 400x10 mode 2），站在地图中间它照样露出来。
; 这个开关是在**画面上直接不画最上面 N 像素**（抹成黑色），所以站在哪里都有效。
; 单位 = 像素；0 = 不裁（默认）。支持按地图和通配：
;     CameraTopCrop.240040700 = 40
;     CameraTopCrop.24* = 30
; 注意：裁剪是屏幕空间的，最上面那条里如果有 HUD 也会一起被盖住；建议从 20~40 开始试。
CameraTopCrop = 0
;CameraTopCrop.24* = 30

; ------------------------------------------------------------
;  地图背景补空（消掉地图四周的黑边）
; ------------------------------------------------------------
; true = 把地图"铺不满屏幕"的背景横向铺满，消掉地图四周的黑边（龙之谷 240040000 /
;        240040600 / 240040700 这一片：远景是按 800 宽摆的，一对 400px 的图拼出 800，
;        1366 下四周就空出黑边）。只动"最靠后的几层"，也就是天幕/远景那一叠。
; false = 原版行为（黑边保留）。
WideBackFill = true

; 允许铺的是"每张地图最靠后的几层"（地图的 back 列表是从远到近排的，最前面几层就是天幕/
; 远景；再往后是作者手摆的景物——石头、树、雕像，那些绝对不能铺，一铺就满屏重复）。
; 画面上的黑边只由"最靠后那一层有没有盖住屏幕"决定，所以这里给几层就看要把远景铺到多深：
;   3 = 天幕两层 + 再往下一层（默认。龙之谷 240040000/600/700 实测：3 刚好，4 就会把
;       第 4 层那张手摆的景物也铺开）
;   4 / 6 / 8 = 继续往下铺（看到景物重复就往回退）
;   0 = 完全不铺：这张图恢复原版 —— 连"把平铺宽度撑满屏幕"这一步也不做，所以地图自己的
;       背景只铺到客户端算给它的宽度，多出来的地方就是黑边（下面"某张图允许补铺的层数"
;       里有例子：211040800 那一组就是这么处理的）
WideBackFillBackmost = 3

; ------------------------------------------------------------
;  某张图"允许补铺的层数"（按地图 / 通配）
; ------------------------------------------------------------
; 有些地图 back 列表最前面几层里混着实体景物（不是天幕），横向一铺就满屏水平重复、把地图整个盖住。
; 这种图就单独给它一个更小的层数：
;     WideBackFillBackmost.240040700 = 1     ; 这张图只允许铺最底那一层
;     WideBackFillBackmost.2400* = 0         ; 2400 开头的图完全不补铺（= 原版）
; 0 = 这张图不做任何补铺。日志里每层末尾的 [backmost] 就是"被允许铺的层"，照着调。
;WideBackFillBackmost.240040700 = 1
;WideBackFillBackmost.2400* = 0
; 三个军营出现前置objct
WideBackFillBackmost.10103011* = 2
; 雪域的后面垂直地图会出现遮挡的情况
WideBackFillBackmost.211040* = 2

; ★ 0 还有第二层意思（2026-10-09 加）：这张图连"把平铺宽度撑到屏幕大小"都不做。
;   211040800/900/1000 本身只有 892 宽（窗口 1366），背景是一片 179x170 的无缝天幕 +
;   一堆比地图还宽的景物贴图；撑满屏幕会把景物横着铺到没有地图的地方，两边就只剩重复素材。
;   给 0 以后：这张图的背景只铺到它自己的宽度，两边保持黑边 —— 就是北斗 083 的样子。
;   注意比上面 211040* 更长，所以这三张优先用 0，其它 211040xxx 还是用 2。
WideBackFillBackmost.2110408* = 0
WideBackFillBackmost.2110409* = 0
WideBackFillBackmost.2110410* = 0

; ------------------------------------------------------------
;  地图两边直接涂黑（083 的效果，2026-10-10）
; ------------------------------------------------------------
; 地图比屏幕窄的图（211040800/900/1000：地图 892 宽、窗口 1366），两边那一圈本该是黑的；但有些图
; 的远景贴图比地图本身还宽（1200 > 892），一画就伸到地图外面，看着像"悬空的素材"。
; 打开 = 在画面上把地图 VR 以外那两条竖带涂黑（世界照画，图里的远景一块都不少）—— 就是 083 的样子
; （083 是客户端自己把世界裁在地图边缘：桌面那张 083.png 量出来内容正好在地图 892 宽处硬切）。
; 地图比屏幕宽的图自动不受影响；底部留 SideBlackBarsBottom 像素不涂，给状态栏/小地图/聊天框让位。
SideBlackBars = false
SideBlackBarsBottom = 0
; 自测：211040800 / 211040900 / 211041000 这三张。想整族都涂黑就改成 211040* = true
SideBlackBars.2110408* = true
SideBlackBars.2110409* = true
SideBlackBars.2110410* = true
; 涂黑到哪：这几张图的 info/VRRight-VRLeft = 892（地图自己的视口宽度）。自动值是"地图实体范围 + 2x Margin"，
; 想精确对齐 083 就按地图写死；不写就是自动值。
SideBlackBarsWidth.2110408* = 892
SideBlackBarsWidth.2110409* = 892
SideBlackBarsWidth.2110410* = 892
; 是否把 UI（可拖动窗口：小地图/装备/物品/技能/任务栏/聊天）也挤进可见区。true = 挤（默认），
; false = UI 完全不动（黑边可能压住窗口，但布局和你原来的一模一样）。
SideBlackBarsShiftUi = false
; 211041000 的远景层在 WZ 里全是 type 0（v053 原版根本不画，是我们那 6 个 NOP 才画出来的），
; 而且它的贴图比地图还宽（1200x388 / 1200x482 / 1101x339 / 819x405 / 734x401 对 892 宽的地图），
; 一画就左右各伸出约 150px 压在两边。这张图干脆不画这些层（远景会空一点，但两边干净）。

; ------------------------------------------------------------
;  背景竖向也平铺（消掉画面上下那两条黑边）
; ------------------------------------------------------------
; 上下那两块黑 = "没有任何背景层画到那里"（客户端清屏色是不透明黑）。地图最靠后的那几层如果
; 比视口矮（例如 400x516，而画面 768 高），它只画自己那一块，上面/下面那一截就没人管。
; true （默认）= 把"最靠后、且比视口矮"的层也加上竖向平铺，客户端会沿高度铺满视口，
;                上下就被背景盖住，不再露黑边。
; false        = 保持以前的行为（上下会露黑边）。
; 某张图竖着铺之后变难看（本来只有一条的地平线被重复），可以按地图/通配关掉：
;     WideBackFillVertical.240040600 = false
;     WideBackFillVertical.2400* = false
WideBackFillVertical = false
; 竖向补铺只给"最靠后的这几层"（默认 1 = 只给最底那一层，通常就是天空/纯色天幕）。
; 千万不要跟着 WideBackFillBackmost 走：第 3 层往往是带树/石头的地平线，竖着一铺就满屏重复
; 的 object（实机验证过）。想让更多层竖铺就一层层往上加。
WideBackFillVerticalBackmost = 1
;WideBackFillVertical.240040600 = false


[chinese]
; ------------------------------------------------------------
;  汉化
; ------------------------------------------------------------
; true = 中文翻译总开关：读下面的翻译表，把界面 / 任务 / 物品名换成中文。
TranslateText = true

; 翻译表文件名，放在客户端主目录。
TranslationPath = stringpool053_zh.txt

; true = 修服务端下发文本的编码问题（中文不乱码的关键之一）。
ServerTextFix = true

; 调试：每替换一条文本就写一行日志。
; ★ 平时一定要 false —— 开着会非常卡（每条文本都要格式化 + 写盘）。
DebugTranslation = false

; 调试：界面布局日志（调 HUD 位置时用）。发布版 false。
DebugUiLayout = false


[ime]
; ------------------------------------------------------------
;  输入法
; ------------------------------------------------------------
; true = 修输入法组字（候选窗、光标定位）。想在游戏里打中文，这个必须 true。
ChineseInputFix = true


; ------------------------------------------------------------
;  鼠标滚轮把光标甩到右下角（对话框滚动条上滚轮）
; ------------------------------------------------------------
; 处理滚轮消息(WM_MOUSEWHEEL)时客户端会重设一次光标位置，用的却是 800x600 设计空间的坐标，
; 改了分辨率以后就把光标甩到右下角（动一下鼠标才回来）。北斗 v083 的修法是滚轮时跳过 SetCursorPos，
; 这里等价地：滚轮消息期间跳过 CInputSystem::SetCursorPos。
; true （默认）= 修好；false = 恢复原版（光标又会甩）。
MouseWheelCursorFix = true

; true = 修中文文本的宽度 / 换行计算（中文比英文宽，不修的话聊天栏会串行）。
ChineseTextFix = true

; true  = 默认英文输入法：不管窗口怎么切，一律把输入法关掉（ImmSetOpenStatus(FALSE)），
;         要打中文自己按 Ctrl+Space 切。输入法上下文一直挂着，所以 Ctrl+Space 一定有反应。
; false = 不去动系统的输入法状态。
ImeDefaultEnglish = true

; true = 保证游戏窗口一直有输入法上下文（只做这一件事：让玩家自己的 Ctrl+Space 能用）。
ImeAvailable = true

; true  = 自动模式：进聊天框自动切中文、离开自动关。
; false = 不自动切，只保留 ImeDefaultEnglish / 玩家手动切。
ImeChatAutoMode = false


[feature]
; ------------------------------------------------------------
;  功能
; ------------------------------------------------------------
; VIP 传送石(5041000) 能保存的地点数量上限。默认 10，这里放到 100。
; ★ 必须和服务端配套：服务端 Character.VIP_TROCK_SIZE 要改成一样的值，
;   否则封包长度对不上，一用就掉线。
TrockListMax = 100

; 点装"脚本装备"ID 列表，逗号分隔。
; 列表里的装备点"穿戴"时不会真的穿到身上：客户端只照常发一次换位请求，
; 这件事到底是什么意思由服务端决定（比如打开一个脚本 / 手机界面）。
; 例：1702050 = 打开手机脚本。留空 = 关闭这个功能。
ScriptEquipItems = 1702050

; 搜索器 / 米涅瓦的猫头鹰（The Owl of Minerva，商城道具 5230000）。
; 原版客户端只在自由市场里能用它：发包前会检查当前地图 ID 是不是 91xxxxxxx（自由市场），
; 不是就弹"只能在自由市场使用"并把请求拦下来。
;   true  = 去掉这个地图限制：在任何地图双击都会照常把"使用现金道具"包发给服务端，
;           包本身完全不变（opcode 0x53 + u16 槽位 + u32 道具ID），由服务端决定怎么处理
;           （例如认出 5230000 后打开一个 NPC 脚本）。
;   false = 恢复原版（只能在自由市场用）。
OwlUseAnywhere = true


[debug]
; ------------------------------------------------------------
;  调试
; ------------------------------------------------------------
; 总日志开关。日志走 OutputDebugString，要看就挂一个 DebugView（或 VS 的输出窗口）。
DebugMessages = false

; 脚本装备功能的详细日志。调 ScriptEquipItems 时开。
DebugScriptEquip = true

; 搜索器每次发包写一行到客户端目录的 owl_search.log（调 OwlUseAnywhere 时开）。
DebugOwlSearch = false

; true = 客户端出异常时把信息写到客户端目录的日志文件里（排查闪退用）。
CrashLog = true
