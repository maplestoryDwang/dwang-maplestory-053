; ============================================================
;  CMSLauncherLite / Hook.dll  运行时配置
; ============================================================
;
;  放在客户端主目录（和 MapleStory.exe / Launcher.exe 同一个文件夹）。
;  这个文件可以不写：
;    - 没有这个文件   -> 全部用 Hook.dll 里内置的默认值（也就是下面注释里写的那些值）
;    - 文件里没写的项 -> 保持内置默认值
;    - 文件里写了的项 -> 覆盖内置默认值（存盘后重启客户端就生效，不用重新编译 DLL）
;
;  语法：
;    [小节名]      只是一个分组标题，程序不解析，写不写都行
;    键=值         键名不分大小写；等号两边多打的空格会被忽略
;    ; 或 #        整行注释；写在一行后面也是注释（所以值里不能出现 ; 和 #）
;    布尔值        true / false，也认 1 / 0、yes / no、on / off
;    整数          十进制，也认 0x 开头的十六进制
;    字符串        照原样取，不要加引号
;
;  注意：
;    1) 这个文件只能改下面列出的这些开关。别的（HUD 细项、补丁偏移表之类）还是编译期的
;       常量，要改必须重新编译 Hook.dll。
;    2) 文件存成 UTF-8 或 ANSI(GBK) 都能读：键名和值必须都是英文/数字，中文只出现在注释里。
;    3) 想确认到底读到没有：用 DebugView 之类的工具看 [Config] 开头的日志。
;
; ============================================================


[general]
; ------------------------------------------------------------
;  资源与连接
; ------------------------------------------------------------
; 服务器地址。
ServerAddr = 127.0.0.1

; 游戏窗口标题。
WindowTitle = goms

; 资源读取方式。
;   false = 读原版 WZ 档（Base.wz / String.wz / UI.wz ...），这是 GMS v053 本来的样子。
;           本客户端只需要那些分门的 .wz，不需要 Data.wz。
;   true  = 读 Data 文件夹里的 IMG。想手工改资源（导出 xml、改完再打包回 img）的时候用这个，
;           能躲开一部分 WZ 解析引起的崩溃。
; 想用 true，客户端目录里得真的有 Data 文件夹，否则会找不到资源。
UseImgMode = false

; 调试：把引擎打开的每一个资源文件都打一行日志（找缺失资源时开）。
; 平时关掉 —— 会明显拖慢加载。
DebugFileAccess = false


[resolution]
; ------------------------------------------------------------
;  分辨率与镜头
; ------------------------------------------------------------
; 分辨率档位，对应 DLL 内置的档位表：
;   0 = 800 x 600（原版）   1 = 1366 x 768   2 = 1600 x 900
; 写别的数字会被当成 0。档位越高越吃显存，也越容易在某些地图上出问题；实测 1 最稳。
; 登录界面永远是 800x600，进了地图才切到这一档 —— 这是客户端的限制，不是 bug。
ScreenResolutionIndex = 1

; 分辨率日志。DebugResolution 打关键几步；DebugResolutionVerbose 打全部细节（非常吵）。
DebugResolution = true
DebugResolutionVerbose = false

; true = 允许在游戏里用热键实时切换上面那个档位（调试用）。发布版建议 false。
RuntimeResolutionSwitch = true

; true = 客户端启动时就把分辨率补丁打好。必须 true，否则分辨率不会生效。
ApplyAtStartup = true

; true  = 创建和分辨率等大的后台缓冲区。画面最干净，但显存占用高，
;         老显卡 / 核显 / 远程桌面下可能黑屏。
; false = 让 D3D 按需拉伸，兼容性更好（个别场景边缘可能有一条拉伸痕迹）。
ExactScreenBuffers = false

; true = 镜头贴边：人物走到地图墙边时画面不再跟着走，也就不需要渲染地图外面的
;        （VR 之外）本来看不到的素材，不会再有地图下沿"穿出去"的穿帮。
;        就是 kaentake 那种"到墙边就不动了"的效果。
ClampCameraToMap = true

; ------------------------------------------------------------
;  镜头纵向"收多少"（河下面那截地面）
; ------------------------------------------------------------
; 百分比 0~100。基准是不 hook 分辨率的原版那条线（画面下沿 = 地图 VR 的 bottom；
; 没有 VR 节点的图就是 实体范围 MBR.bottom + 100）。地图实体范围通常比这条线高，
; 中间那一段就是"河下面多露出来的地面"，这里决定收掉多少：
;     收掉的量 = (画面下沿 - MBR.bottom) × 这个百分比
;   0   = 完全不收（原版行为：河完整，但底下多露一截）
;   100 = 一直收到 MBR.bottom（实测**收太狠**：河的下半截被切、240010000 人走到屏幕外）
;   50  = 收一半（默认，就是"比 100 少一半"）
; 没有多余余量的地图不受影响；改完重启客户端即可，不用重编。
CameraBottomSlack = 50

; ------------------------------------------------------------
;  地图背景补空（消掉地图四周的黑边）
; ------------------------------------------------------------
; true = 把地图"铺不满屏幕"的背景横向铺满，消掉地图四周的黑边（龙之谷 240040000 /
;        240040600 / 240040700 这一片：远景是按 800 宽摆的，一对 400px 的图拼出 800，
;        1366 下四周就空出黑边）。只动"最靠后的几层"，也就是天幕/远景那一叠。
; false = 原版行为（黑边保留）。
WideBackFill = true

; 允许铺的是"每张地图最靠后的几层"（地图的 back 列表是从远到近排的，最前面几层就是天幕/
; 远景；再往后是作者手摆的景物——石头、树、雕像，那些绝对不能铺，一铺就满屏重复）。
; 画面上的黑边只由"最靠后那一层有没有盖住屏幕"决定，所以这里给几层就看要把远景铺到多深：
;   3 = 天幕两层 + 再往下一层（默认。龙之谷 240040000/600/700 实测：3 刚好，4 就会把
;       第 4 层那张手摆的景物也铺开）
;   4 / 6 / 8 = 继续往下铺（远景分好几叠的地图可以往上加，看到景物重复就往回退）
;   0 = 完全不铺（等于关掉补空）
WideBackFillBackmost = 3


[chinese]
; ------------------------------------------------------------
;  汉化
; ------------------------------------------------------------
; true = 中文翻译总开关：读下面的翻译表，把界面 / 任务 / 物品名换成中文。
TranslateText = true

; 翻译表文件名，放在客户端主目录。
TranslationPath = stringpool053_zh.txt

; true = 修服务端下发文本的编码问题（中文不乱码的关键之一）。
ServerTextFix = true

; 调试：每替换一条文本就写一行日志。
; ★ 平时一定要 false —— 开着会非常卡（每条文本都要格式化 + 写盘）。
DebugTranslation = false

; 调试：界面布局日志（调 HUD 位置时用）。发布版 false。
DebugUiLayout = false


[ime]
; ------------------------------------------------------------
;  输入法
; ------------------------------------------------------------
; true = 修输入法组字（候选窗、光标定位）。想在游戏里打中文，这个必须 true。
ChineseInputFix = true

; true = 修中文文本的宽度 / 换行计算（中文比英文宽，不修的话聊天栏会串行）。
ChineseTextFix = true

; true  = 默认英文输入法：不管窗口怎么切，一律把输入法关掉（ImmSetOpenStatus(FALSE)），
;         要打中文自己按 Ctrl+Space 切。输入法上下文一直挂着，所以 Ctrl+Space 一定有反应。
; false = 不去动系统的输入法状态。
ImeDefaultEnglish = true

; true = 保证游戏窗口一直有输入法上下文（只做这一件事：让玩家自己的 Ctrl+Space 能用）。
ImeAvailable = true

; true  = 自动模式：进聊天框自动切中文、离开自动关。
; false = 不自动切，只保留 ImeDefaultEnglish / 玩家手动切。
ImeChatAutoMode = false


[feature]
; ------------------------------------------------------------
;  功能
; ------------------------------------------------------------
; VIP 传送石(5041000) 能保存的地点数量上限。默认 10，这里放到 100。
; ★ 必须和服务端配套：服务端 Character.VIP_TROCK_SIZE 要改成一样的值，
;   否则封包长度对不上，一用就掉线。
TrockListMax = 100

; 点装"脚本装备"ID 列表，逗号分隔。
; 列表里的装备点"穿戴"时不会真的穿到身上：客户端只照常发一次换位请求，
; 这件事到底是什么意思由服务端决定（比如打开一个脚本 / 手机界面）。
; 例：1702050 = 打开手机脚本。留空 = 关闭这个功能。
ScriptEquipItems = 1702050

; 搜索器 / 米涅瓦的猫头鹰（The Owl of Minerva，商城道具 5230000）。
; 原版客户端只在自由市场里能用它：发包前会检查当前地图 ID 是不是 91xxxxxxx（自由市场），
; 不是就弹"只能在自由市场使用"并把请求拦下来。
;   true  = 去掉这个地图限制：在任何地图双击都会照常把"使用现金道具"包发给服务端，
;           包本身完全不变（opcode 0x53 + u16 槽位 + u32 道具ID），由服务端决定怎么处理
;           （例如认出 5230000 后打开一个 NPC 脚本）。
;   false = 恢复原版（只能在自由市场用）。
OwlUseAnywhere = true


[debug]
; ------------------------------------------------------------
;  调试
; ------------------------------------------------------------
; 总日志开关。日志走 OutputDebugString，要看就挂一个 DebugView（或 VS 的输出窗口）。
DebugMessages = false

; 脚本装备功能的详细日志。调 ScriptEquipItems 时开。
DebugScriptEquip = true

; 搜索器每次发包写一行到客户端目录的 owl_search.log（调 OwlUseAnywhere 时开）。
DebugOwlSearch = false

; true = 客户端出异常时把信息写到客户端目录的日志文件里（排查闪退用）。
CrashLog = true
